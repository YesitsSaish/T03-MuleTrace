[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "risklens"
version = "1.0.0"
description = "Enterprise Hybrid GNN & Heuristic Graph Fraud Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "RiskLens Engineering" }]
keywords = ["gnn", "fraud-detection", "aml", "graph-neural-networks", "heuristics", "fastapi"]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "torch>=2.2",
    "torch-geometric>=2.5",
    "scikit-learn>=1.3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]
postgres = ["psycopg2-binary>=2.9"]

[project.scripts]
risklens = "risklens.cli:main"
upifraud = "risklens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
risklens = [
    "frontend/*.html",
    "frontend/*.css",
    "frontend/*.js",
    "database/*.sql",
]

[tool.ruff]
line-length = 100
target-version = "py311"
